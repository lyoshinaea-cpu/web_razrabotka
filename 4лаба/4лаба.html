<body>

  <h2>Задания 4 лаброраторной</h2>
  <button onclick="first()">1 задание</button>
  <button onclick="second()">2 задание</button>
  <button onclick="third()">3 задание</button>
  <button onclick="fourth()">4 задание</button>
  <button onclick="fiveth()">5 задание</button>
  <button onclick="sixth()">6 задание</button>

  
  <script>
    function first()
    {
      let admin, name;
      name =  "Джон";
      admin = name;
      alert(admin);
    } 
    
    function second()
    {
      let a = Number(prompt("Первое число?", 1));
      let b = Number(prompt("Второе число?", 2));
      alert(a + b); 
    }

    function third()
    {
      for(let i = 2; i <= 10; i+=2)
      {
          alert(i);
      }
    }
     


    function fourth()
    {
      let i = 0;
      while(i<3)
      {
        alert( `number ${i}!` );
        i++;
      }
    }

    function fiveth()
    {
      let a;
      do{
        a = prompt("Введите число больше 100", "");
      }while(a <=100 && a !== null);    
    }


    function sixth()
    {
      let n = 20;
      for (let i = 2; i <= n; i++) 
      {
        let isPrime = true;
        for (let j = 2; j < i; j++) 
        {
          if (i % j == 0) 
          {
            isPrime = false;
            break; 
          }
        }
        if (isPrime) alert(`Простое число ${i}`); 
      }


    }
      
    
    

    
  </script>
